[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-piper"
dynamic = ["version"]
description = "Display X.509 certificate information from piped input"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
authors = [
    { name = "tkdpython" },
]
keywords = ["certificates", "tls", "x509", "pem", "security", "pipe", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=2.8",
    "rich>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
]

[project.scripts]
cert-piper = "cert_piper.cli:main"

[project.urls]
Homepage = "https://github.com/tkdpython/cert-piper"
Repository = "https://github.com/tkdpython/cert-piper"
Issues = "https://github.com/tkdpython/cert-piper/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cert_piper*"]

[tool.setuptools_scm]
version_file = "cert_piper/_version.py"
version_file_template = '''
# file generated by setuptools-scm
# don't change, don't track in version control

__version__ = version = "{version}"
'''
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
